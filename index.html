<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Family Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f0f4ff; --surface:#fff; --border:#e2e8f0;
  --shadow:0 4px 20px rgba(0,0,0,.08); --radius:14px;
  --dad:#3b82f6;    --dad-lt:#dbeafe;       --dad-text:#1d4ed8;
  --mom:#8b5cf6;    --mom-lt:#ede9fe;       --mom-text:#6d28d9;
  --charlotte:#f97316; --charlotte-lt:#ffedd5; --charlotte-text:#c2410c;
  --alice:#06b6d4;  --alice-lt:#cffafe;     --alice-text:#0e7490;
  --family:#10b981; --family-lt:#d1fae5;    --family-text:#065f46;
  --school:#ec4899; --school-lt:#fce7f3;    --school-text:#9d174d;
  --meal:#f59e0b;   --meal-lt:#fef3c7;      --meal-text:#92400e;
  --meal-border:#fde68a; --meal-hover:#fde68a;
  --text:#1e293b; --muted:#64748b; --today-ring:#3b82f6;
  --danger-hover:#fee2e2;
}
[data-theme="dark"] {
  --bg:#0f172a; --surface:#1e293b; --border:#334155;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --dad:#60a5fa;    --dad-lt:#1e3a8a;       --dad-text:#bfdbfe;
  --mom:#a78bfa;    --mom-lt:#4c1d95;       --mom-text:#ddd6fe;
  --charlotte:#fb923c; --charlotte-lt:#7c2d12; --charlotte-text:#fed7aa;
  --alice:#22d3ee;  --alice-lt:#155e75;     --alice-text:#a5f3fc;
  --family:#34d399; --family-lt:#064e3b;    --family-text:#a7f3d0;
  --school:#f472b6; --school-lt:#831843;    --school-text:#fbcfe8;
  --meal:#fbbf24;   --meal-lt:#78350f;      --meal-text:#fde68a;
  --meal-border:#92400e; --meal-hover:#92400e;
  --text:#f1f5f9; --muted:#94a3b8; --today-ring:#60a5fa;
  --danger-hover:#7f1d1d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
transition:background .2s,color .2s;}

/* ── HEADER ── */
header{
background:var(--surface); border-bottom:3px solid var(--border);
padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
box-shadow:var(--shadow); position:sticky; top:0; z-index:100;
}
.logo{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--dad);min-width:160px;}
.logo span{color:var(--alice);}
.nav-month{display:flex;align-items:center;gap:10px;}
.nav-month h2{font-family:'Fredoka One',cursive;font-size:1.25rem;min-width:195px;text-align:center;}
.btn-nav{background:var(--bg);border:2px solid var(--border);border-radius:50%;width:32px;height:32px;
font-size:.95rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .15s;}
.btn-nav:hover{background:var(--dad-lt);}
.btn-today{background:var(--dad);color:#fff;border:none;border-radius:20px;padding:5px 14px;
font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:opacity .15s;}
.btn-today:hover{opacity:.85;}
.sync-btn{background:var(--family-lt);color:var(--family-text);border:2px solid var(--family);border-radius:20px;
padding:5px 13px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;
transition:all .15s;display:flex;align-items:center;gap:5px;}
.sync-btn:hover{background:var(--family);color:#fff;}
.sync-btn.syncing{opacity:.55;pointer-events:none;}
.meal-lib-btn{background:var(--meal-lt);color:var(--meal-text);border:2px solid var(--meal);border-radius:20px;
padding:5px 13px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;
transition:all .15s;display:flex;align-items:center;gap:5px;}
.meal-lib-btn:hover{background:var(--meal);color:#fff;}
.theme-toggle,.refresh-btn{background:var(--bg);border:2px solid var(--border);border-radius:50%;
width:32px;height:32px;font-size:.95rem;cursor:pointer;color:var(--text);display:flex;align-items:center;
justify-content:center;transition:background .15s;}
.refresh-btn:hover{background:var(--family-lt);}
.refresh-btn.spinning{animation:spin 1s linear infinite;pointer-events:none;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.theme-toggle:hover{background:var(--dad-lt);}
.view-mode-pills{display:flex;gap:2px;background:var(--bg);border:2px solid var(--border);
border-radius:18px;padding:2px;}
.view-mode-btn{background:none;border:none;padding:4px 11px;font-family:'Nunito',sans-serif;
font-weight:700;font-size:.75rem;cursor:pointer;border-radius:14px;color:var(--muted);
transition:all .15s;}
.view-mode-btn.active{background:var(--dad);color:#fff;}
.view-mode-btn:not(.active):hover{color:var(--text);}
/* WEEK VIEW: tall, detailed cells that fill the screen */
.cal-grid.week-view{gap:8px;}
.cal-grid.week-view .cal-cell{
  min-height:calc(100vh - 280px);
  padding:10px;gap:6px;border-radius:14px;
  overflow-y:auto;
}
.cal-grid.week-view .day-num{width:30px;height:30px;font-size:1rem;}
.cal-grid.week-view .event-chip{
  font-size:.85rem;padding:8px 11px;border-radius:10px;
  white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;
  display:flex;flex-direction:column;gap:2px;
}
.cal-grid.week-view .event-chip .ec-title{font-weight:800;line-height:1.25;}
.cal-grid.week-view .event-chip .ec-meta{font-size:.74rem;font-weight:600;opacity:.85;line-height:1.2;}
.cal-grid.week-view .more-chip{font-size:.8rem;padding:4px 6px;}
.cal-grid.week-view .meal-strip-cell{min-height:60px;padding:10px 12px;}
.cal-grid.week-view .meal-strip-cell .meal-icon{font-size:1.3rem;}
.cal-grid.week-view .meal-strip-cell .meal-name{font-size:.85rem;white-space:normal;line-height:1.3;}
.cal-grid.week-view .meal-strip-cell .meal-empty{font-size:.85rem;}
.cal-multi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
@media(max-width:800px){.cal-multi{grid-template-columns:1fr;gap:24px;}}
.month-section{display:flex;flex-direction:column;gap:4px;min-width:0;}
.month-section-title{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--dad);
margin-top:2px;text-align:center;}

/* Compact cell rendering inside the 3-month side-by-side view */
.cal-multi .cal-grid{gap:1px;background:var(--border);padding:1px;border-radius:8px;}
.cal-multi .day-labels{gap:1px;}
.cal-multi .day-label{font-size:.6rem;padding:2px 0;}
.cal-multi .cal-cell{min-height:48px;padding:2px;gap:2px;
  border:none;border-radius:0;background:var(--surface);}
.cal-multi .cal-cell:hover{box-shadow:none;}
.cal-multi .cal-cell.other-month{background:var(--bg);}
.cal-multi .cal-cell.today{box-shadow:inset 0 0 0 2px var(--today-ring);}
.cal-multi .day-num{width:16px;height:16px;font-size:.62rem;}
.cal-multi .cal-cell.today .day-num{background:var(--today-ring);color:#fff;}
.cal-multi .event-chip{
  font-size:0;color:transparent;height:7px;padding:0;border-radius:0;
  line-height:0;overflow:hidden;margin:0 -2px;
}
.cal-multi .event-chip.multi-day-cont{border-left:0;padding-left:0;font-style:normal;opacity:1;}
.cal-multi .event-chip.multi-day-start{border-radius:4px 0 0 4px;margin-left:0;}
.cal-multi .event-chip.multi-day-end{border-radius:0 4px 4px 0;margin-right:0;}
.cal-multi .event-chip:not(.multi-day-cont):not(.multi-day-start){border-radius:4px;margin:0;}
.cal-multi .more-chip{font-size:.55rem;color:var(--muted);}
.cal-multi .meal-strip{display:none;}
.legend{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:auto;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;
padding:4px 8px;border-radius:14px;}
.legend-item[data-person]{cursor:pointer;transition:opacity .15s,background .15s;user-select:none;}
.legend-item[data-person]:hover{background:var(--bg);}
.legend-item.filtered-out{opacity:.32;}
.legend-dot{width:11px;height:11px;border-radius:50%;}

/* ── STATUS BAR ── */
.sync-bar{background:var(--family-lt);border-bottom:2px solid var(--family);
padding:5px 18px;font-size:.78rem;font-weight:700;color:var(--family-text);display:flex;align-items:center;gap:8px;}
.sync-bar.hidden{display:none;}

/* ── MAIN ── */
.calendar-wrap{padding:14px;max-width:1300px;margin:0 auto;}

/* ── REMINDER BANNERS ── */
.reminder-banner{border-radius:var(--radius);padding:11px 16px;margin-bottom:8px;
display:flex;align-items:center;gap:11px;animation:slideIn .4s ease;}
.reminder-banner.charlotte-banner{background:linear-gradient(135deg,#f97316,#fb923c);box-shadow:0 4px 16px rgba(249,115,22,.28);}
.reminder-banner.alice-banner{background:linear-gradient(135deg,#06b6d4,#22d3ee);box-shadow:0 4px 16px rgba(6,182,212,.28);}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.bell{font-size:1.4rem;}
.rem-text{flex:1;font-weight:700;font-size:.88rem;line-height:1.5;color:#fff;}
.rem-text strong{font-size:.95rem;display:block;margin-bottom:2px;}
.btn-dismiss{background:rgba(255,255,255,.25);border:none;border-radius:8px;color:#fff;padding:4px 11px;
font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;font-size:.8rem;white-space:nowrap;}

/* ── UPCOMING MILESTONES STRIP ── */
.upcoming-strip{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding:2px 2px 6px;}
.upcoming-strip:empty{display:none;}
.upcoming-strip::-webkit-scrollbar{height:4px;}
.upcoming-strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.upcoming-item{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:8px 13px;
border-radius:14px;background:var(--bg);color:var(--text);
font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer;
border:2px solid transparent;transition:transform .15s,box-shadow .15s;}
.upcoming-item:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.12);}
.upcoming-item .uc-icon{font-size:1.15rem;}
.upcoming-item .uc-title{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upcoming-item .uc-count{font-size:.72rem;font-weight:800;background:rgba(255,255,255,.45);
padding:2px 9px;border-radius:11px;letter-spacing:.02em;}
.upcoming-item.dad      {background:var(--dad-lt);      color:var(--dad-text);}
.upcoming-item.mom      {background:var(--mom-lt);      color:var(--mom-text);}
.upcoming-item.charlotte{background:var(--charlotte-lt);color:var(--charlotte-text);}
.upcoming-item.alice    {background:var(--alice-lt);    color:var(--alice-text);}
.upcoming-item.family   {background:var(--family-lt);   color:var(--family-text);}
.upcoming-item.school   {background:var(--school-lt);   color:var(--school-text);}
.upcoming-item.today{animation:pulse 2s ease-in-out infinite;}
.upcoming-item.today .uc-count{background:#fff;color:#000;}

/* ── CALENDAR GRID ── */
.day-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:5px;text-align:center;}
.day-label{font-weight:800;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}

/* Each week row = 7 day cells + 1 meal strip spanning full width */
.week-row{display:contents;}

.cal-cell{
background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
min-height:110px;padding:6px;display:flex;flex-direction:column;gap:3px;
cursor:pointer;transition:box-shadow .15s,border-color .15s;
}
.cal-cell:hover{box-shadow:0 5px 18px rgba(0,0,0,.11);border-color:#cbd5e1;}
.cal-cell.other-month{opacity:.32;}
.cal-cell.today{border:3px solid var(--today-ring);box-shadow:0 0 0 3px rgba(59,130,246,.13);}

.day-num{font-weight:800;font-size:.92rem;line-height:1;display:flex;align-items:center;
justify-content:center;width:25px;height:25px;border-radius:50%;flex-shrink:0;}
.today .day-num{background:var(--today-ring);color:#fff;}

.event-chip{border-radius:7px;padding:2px 6px;font-size:.67rem;font-weight:700;line-height:1.3;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .1s,transform .1s;}
.event-chip:hover{opacity:.85;transform:translateY(-1px);}
.event-chip.dad      {background:var(--dad-lt);      color:var(--dad-text);}
.event-chip.mom      {background:var(--mom-lt);      color:var(--mom-text);}
.event-chip.charlotte{background:var(--charlotte-lt);color:var(--charlotte-text);}
.event-chip.alice    {background:var(--alice-lt);    color:var(--alice-text);}
.event-chip.family   {background:var(--family-lt);   color:var(--family-text);}
.event-chip.school   {background:var(--school-lt);   color:var(--school-text);}
.more-chip{font-size:.64rem;font-weight:700;color:var(--muted);padding:1px 4px;cursor:pointer;}

/* ── WEEKLY MEAL STRIP ── */
.meal-strip{
grid-column:1 / -1;
display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px;
margin-bottom:5px;
}
.meal-strip-cell{
background:var(--meal-lt); border:2px solid var(--meal-border); border-radius:10px;
padding:4px 7px; min-height:34px;
display:flex; align-items:center; gap:5px;
cursor:pointer; transition:background .15s, border-color .15s;
position:relative;
}
.meal-strip-cell:hover{background:var(--meal-hover);border-color:var(--meal);}
.meal-strip-cell.other-month-meal{opacity:.3;pointer-events:none;}
.meal-strip-cell .meal-icon{font-size:.9rem;flex-shrink:0;}
.meal-strip-cell .meal-name{font-size:.68rem;font-weight:700;color:var(--meal-text);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.meal-strip-cell .meal-empty{font-size:.65rem;color:var(--meal-text);font-weight:600;}
.meal-strip-cell .meal-del{
position:absolute;top:2px;right:4px;font-size:.6rem;color:var(--meal-text);
cursor:pointer;opacity:0;transition:opacity .15s;background:none;border:none;
}
.meal-strip-cell:hover .meal-del{opacity:1;}

/* ── SIDE PANEL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.26);z-index:200;backdrop-filter:blur(2px);}
.overlay.open{display:block;}
.side-panel{
position:fixed;top:0;right:0;width:400px;max-width:100vw;height:100%;
background:var(--surface);box-shadow:-8px 0 40px rgba(0,0,0,.17);
z-index:201;display:flex;flex-direction:column;
transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
border-radius:18px 0 0 18px;
}
.side-panel.open{transform:translateX(0);}

/* Panel tabs */
.panel-tabs{display:flex;border-bottom:2px solid var(--border);}
.panel-tab{flex:1;padding:12px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;
background:none;border:none;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;
transition:all .15s;margin-bottom:-2px;}
.panel-tab.active{color:var(--dad);border-bottom-color:var(--dad);}
.panel-tab-content{display:none;flex:1;overflow-y:auto;flex-direction:column;}
.panel-tab-content.active{display:flex;}

.panel-header{padding:14px 20px 10px;border-bottom:2px solid var(--border);display:flex;align-items:flex-start;gap:10px;}
.panel-date{font-family:'Fredoka One',cursive;font-size:1.2rem;}
.days-away{display:inline-block;margin-top:5px;padding:3px 11px;border-radius:14px;
font-size:.78rem;font-weight:800;background:var(--family-lt);color:var(--family-text);}
.days-away.today{background:var(--dad);color:#fff;animation:pulse 2s ease-in-out infinite;}
.days-away.soon{background:var(--mom-lt);color:var(--mom-text);}
.days-away.past{background:var(--bg);color:var(--muted);}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.btn-close{background:var(--bg);border:2px solid var(--border);border-radius:50%;
width:32px;height:32px;font-size:1.05rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;}
.btn-close:hover{background:var(--danger-hover);}

.panel-body{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:9px;}
.panel-section-title{font-size:.7rem;font-weight:800;text-transform:uppercase;
letter-spacing:.07em;color:var(--muted);margin-top:6px;}
.panel-event{border-radius:11px;padding:9px 13px;display:flex;align-items:flex-start;gap:9px;}
.panel-event .icon{font-size:1.15rem;flex-shrink:0;margin-top:1px;}
.panel-event .info{flex:1;min-width:0;}
.panel-event .info .ev-title{font-weight:800;font-size:.9rem;}
.panel-event .info .ev-sub{font-size:.76rem;color:var(--muted);font-weight:600;margin-top:2px;}
.panel-event .info .ev-loc{font-size:.72rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panel-event.dad      {background:var(--dad-lt);}
.panel-event.mom      {background:var(--mom-lt);}
.panel-event.charlotte{background:var(--charlotte-lt);}
.panel-event.alice    {background:var(--alice-lt);}
.panel-event.family   {background:var(--family-lt);}
.panel-event.school   {background:var(--school-lt);}
.panel-event.meal     {background:var(--meal-lt);}
.empty-day{text-align:center;color:var(--muted);font-weight:600;padding:26px 0;font-size:.88rem;}

/* Event action buttons (edit / delete) */
.ev-actions{float:right;display:inline-flex;gap:2px;}
.ev-edit,.ev-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;
padding:0 4px;opacity:.85;transition:opacity .15s,color .15s,transform .1s;border-radius:4px;}
.ev-edit:hover,.ev-edit:active{opacity:1;color:var(--dad);transform:scale(1.15);}
.ev-del:hover,.ev-del:active{opacity:1;color:#ef4444;transform:scale(1.15);}

/* Add event form */
.add-form{padding:12px 20px 20px;border-top:2px solid var(--border);display:flex;flex-direction:column;gap:7px;}
.add-form label{font-size:.74rem;font-weight:700;color:var(--muted);}
.add-form input,.add-form select{border:2px solid var(--border);border-radius:9px;
padding:6px 10px;font-family:'Nunito',sans-serif;font-size:.86rem;outline:none;transition:border .15s;
background:var(--surface);color:var(--text);}
.add-form input:focus,.add-form select:focus{border-color:var(--dad);}
.time-row{display:flex;gap:7px;align-items:center;}
.time-row input{flex:1;min-width:0;}
.time-sep{font-size:.74rem;font-weight:700;color:var(--muted);flex:0 0 auto;}
.btn-add{background:var(--dad);color:#fff;border:none;border-radius:9px;padding:8px;
font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;margin-top:2px;transition:opacity .15s;}
.btn-add:hover{opacity:.85;}
.multi-day-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.78rem;
font-weight:700;color:var(--text);user-select:none;}
.multi-day-toggle input{cursor:pointer;width:14px;height:14px;margin:0;}
.person-pills{display:flex;flex-wrap:wrap;gap:5px;}
.person-pill{
  background:var(--bg);border:2px solid var(--border);border-radius:18px;
  padding:6px 12px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;
  cursor:pointer;color:var(--muted);transition:all .15s;user-select:none;
}
.person-pill:hover{color:var(--text);}
.person-pill.active{color:#fff;}
.person-pill.dad.active{background:var(--dad);border-color:var(--dad);}
.person-pill.mom.active{background:var(--mom);border-color:var(--mom);}
.person-pill.charlotte.active{background:var(--charlotte);border-color:var(--charlotte);}
.person-pill.alice.active{background:var(--alice);border-color:var(--alice);}
.person-pill.family.active{background:var(--family);border-color:var(--family);}
.event-chip.multi-day-cont{font-style:italic;opacity:.92;border-left:3px solid currentColor;padding-left:4px;}
.ev-multi-info{font-size:.72rem;color:var(--muted);margin-top:2px;font-weight:700;}

/* ── MEAL PICKER (shown inside side panel for meal strip clicks) ── */
.meal-picker{padding:14px 20px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;}
.meal-picker-title{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--meal);}
.meal-search{border:2px solid var(--border);border-radius:9px;padding:7px 11px;
font-family:'Nunito',sans-serif;font-size:.88rem;outline:none;width:100%;transition:border .15s;
background:var(--surface);color:var(--text);}
.meal-search:focus{border-color:var(--meal);}
.meal-list{display:flex;flex-direction:column;gap:6px;}

// ═══════════════════════════════════════════════

const today = new Date();
let viewYear  = today.getFullYear();
let viewMonth = today.getMonth();
let viewDay   = today.getDate();
let viewMode  = localStorage.getItem('fam-view-mode') || 'month'; // 'week' | 'month' | 'quarter'
let events    = {}; // "Y-M-D" → [{id,title,person,time,icon,location,uid,fromICS}]

let mealLib   = []; // [{id, name, icon, timesUsed, lastUsed}]
let sideLib   = []; // [{id, name, icon, timesUsed, lastUsed}] (localStorage only)
const ALL_PERSONS = ['dad','mom','charlotte','alice','family','school'];
let activePersonFilter = (() => {
  try {
    const saved = localStorage.getItem('fam-person-filter');
    if (saved) {
      const set = new Set(JSON.parse(saved));
      // One-time: filters saved before the school feed existed have no 'school'

      if (!localStorage.getItem('fam-school-filter-v1')) {

// ═══════════════════════════════════════════════
// SUPABASE — EVENTS

async function loadEvents() {
  const cached = lsGet('fam-events-v6') || {};
  try {
    const { data, error } = await db.from('events').select('*').eq('calendar_id', CALENDAR_ID);
    if (error) throw error;
    events = {};
    for (const r of data) {
      if (!events[r.event_key]) events[r.event_key] = [];
      events[r.event_key].push({ id:r.id, title:r.title, person:r.person,
        persons: Array.isArray(r.persons) && r.persons.length ? r.persons : (r.person ? [r.person] : []),
        time:r.time, icon:r.icon, location:r.location||'', jersey:r.jersey||'', uid:r.uid||'', fromICS:r.from_ics });
    }
    // Safety net: any cached event whose id isn't in the DB result was a local-only
    // save (failed DB insert). Preserve it instead of wiping it from the cache.
    const dbIds = new Set();
    for (const list of Object.values(events)) for (const ev of list) dbIds.add(String(ev.id));
    let preserved = 0;
    for (const [k, list] of Object.entries(cached)) {
      for (const ev of list) {
        if (ev.fromICS) continue; // ICS events are authoritative from syncICS — never restore from cache
        // Only preserve events that never made it to DB (local-style id). DB-id'd events
        // missing from the result were deleted on another device — let them disappear.
        if (ev.id && !isDbId(ev.id)) {
          if (!events[k]) events[k] = [];
          events[k].push(ev);
          preserved++;
        }
      }
    }
    if (preserved) console.warn(`⚠️ ${preserved} cached personal event(s) not in DB — preserved as local. Run pushLocalToSupabase() to migrate.`);

    // Recovery: cache has more persons than DB → restore from cache and push back to DB
    const cachedById = new Map();
    for (const list of Object.values(cached)) for (const ev of list) {
      if (ev && ev.id) cachedById.set(String(ev.id), ev);
    }
    let recovered = 0;
    for (const list of Object.values(events)) {
      for (const ev of list) {
        const c = cachedById.get(String(ev.id));
        if (c && Array.isArray(c.persons) && c.persons.length > (ev.persons || []).length) {
          ev.persons = c.persons.slice();
          db.from('events').update({ persons: ev.persons }).eq('id', ev.id).then(()=>{}).catch(()=>{});
          recovered++;
        }
      }
    }
    if (recovered) console.log(`✨ Recovered ${recovered} multi-person event(s) from cache and synced to DB.`);

    lsSet('fam-events-v6', events);
  } catch(e) {
    console.warn('Events load failed, using cache:', e.message);
    events = cached;
  }
  // Migration: backfill missing ids and persons arrays, swap Alice's old bow icon for mermaid
  let migrated = 0;
  for (const k of Object.keys(events)) {
    for (const ev of events[k]) {
      if (!ev.id) { ev.id = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); migrated++; }
      if (!ev.persons) { ev.persons = ev.person ? [ev.person] : []; migrated++; }
      if (ev.icon && (ev.icon.includes('🎀') || ev.icon.includes('🐰')) && (ev.persons||[]).includes('alice') && !ev.fromICS) {
        ev.icon = ev.icon.replace(/🎀/g, '🧜‍♀️').replace(/🐰/g, '🧜‍♀️'); migrated++;
        if (isDbId(ev.id)) {
          db.from('events').update({ icon: ev.icon }).eq('id', ev.id).then(()=>{}).catch(()=>{});
        }
      }
    }
  }
  if (migrated) lsSet('fam-events-v6', events);
}

async function loadMeals() {
  const cached = lsGet('fam-meals-v6') || {};
  try {
    const { data, error } = await db.from('meals').select('*').eq('calendar_id', CALENDAR_ID);
    if (error) throw error;
    meals = {};
    for (const r of data) meals[r.event_key] = { id:r.id, mealId:r.meal_lib_id,
      name:r.name, icon:r.icon,
      sides: Array.isArray(r.sides) ? r.sides
            : (cached[r.event_key] && cached[r.event_key].sides) || [] };
    // Preserve cached meals not present in DB — only if they never made it to DB
    // (id is missing or local). DB-id'd missing rows were deleted on another device.
    let preserved = 0;
    for (const [k, m] of Object.entries(cached)) {
      if (!meals[k] && (m.name || (m.sides && m.sides.length))) {
        if (!m.id || !isDbId(m.id)) { meals[k] = m; preserved++; }
      }
    }
    if (preserved) console.warn(`⚠️ ${preserved} cached meal(s) not in DB — preserved as local.`);
    lsSet('fam-meals-v6', meals);
  } catch(e) {
    console.warn('Meals load failed, using cache:', e.message);
    meals = cached;
  }
  for (const k of Object.keys(meals)) if (!meals[k].sides) meals[k].sides = [];
}

async function assignMeal(key, libItem) {
  // If replacing an existing main meal, decrement its usage
  if (meals[key] && meals[key].mealId) {
    await decrementMealUsage(meals[key].mealId);
  }
  // Preserve any existing sides when changing the main
  const existingSides = (meals[key] && meals[key].sides) || [];
  if (meals[key]) {
    try { await db.from('meals').delete().eq('id', meals[key].id); } catch(e){}
  }
  meals[key] = { name:libItem.name, icon:libItem.icon, mealId:libItem.id, sides:existingSides };
  try {
    const { data, error } = await db.from('meals').insert({
      calendar_id:CALENDAR_ID, event_key:key,
      meal_lib_id:libItem.id, name:libItem.name, icon:libItem.icon, sides:existingSides
    }).select().single();
    if (error) throw error;
    meals[key].id = data.id;
  } catch(e) { console.warn('Assign meal failed:', e.message); }
  await updateMealUsage(libItem.id);
  lsSet('fam-meals-v6', meals);
}

async function removeMeal(key) {
  if (!meals[key]) return;
  // Decrement counts for the main and every side that was on this day
  if (meals[key].mealId) await decrementMealUsage(meals[key].mealId);
  if (meals[key].sides) for (const s of meals[key].sides) decrementSideUsage(s.id);
  try { await db.from('meals').delete().eq('id', meals[key].id); } catch(e){}
  delete meals[key];
  lsSet('fam-meals-v6', meals);
}

async function addSideToDay(key, sideItem) {
  if (!meals[key]) meals[key] = { sides:[] };
  if (!meals[key].sides) meals[key].sides = [];
  if (meals[key].sides.some(s => s.id === sideItem.id)) return; // no duplicates
  meals[key].sides.push({ id:sideItem.id, name:sideItem.name, icon:sideItem.icon });
  await incrementSideUsage(sideItem.id);
  try {
    if (meals[key].id) {
      await db.from('meals').update({ sides: meals[key].sides }).eq('id', meals[key].id);
    } else {
      const { data, error } = await db.from('meals').insert({
        calendar_id:CALENDAR_ID, event_key:key,
        meal_lib_id:null, name:'', icon:'', sides:meals[key].sides
      }).select().single();
      if (error) throw error;
      meals[key].id = data.id;
    }
  } catch(e) { console.warn('Save side failed:', e.message); }
  lsSet('fam-meals-v6', meals);
}

async function removeSideFromDay(key, sideId) {
  if (!meals[key] || !meals[key].sides) return;
  const before = meals[key].sides.length;
  meals[key].sides = meals[key].sides.filter(s => s.id !== sideId);
  if (meals[key].sides.length < before) await decrementSideUsage(sideId);
  const isEmpty = !meals[key].mealId && !meals[key].sides.length;
  const dbId = meals[key].id;
  if (isEmpty) {
    if (dbId) try { await db.from('meals').delete().eq('id', dbId); } catch(e){}
    delete meals[key];
  } else if (dbId) {
    try { await db.from('meals').update({ sides: meals[key].sides }).eq('id', dbId); } catch(e){}
  }
  lsSet('fam-meals-v6', meals);
}

  for (const item of mealLib) {
    if (item.icon === '🍽️') {

  for (const item of sideLib) {

      const guess = guessEmoji(item.name, '🥣');

// ═══════════════════════════════════════════════
// LOCAL STORAGE HELPERS
// ═══════════════════════════════════════════════
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsGet(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}

// ═══════════════════════════════════════════════
// ICS PARSER
// ═══════════════════════════════════════════════
function parseICS(text) {
  // Normalize newlines to LF first, then unfold continuation lines (RFC 5545 §3.1).
  // Playmetrics serves LF-only, so a CRLF-only unfold misses the folds entirely.
  const lines=text.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  const out=[]; let cur=null;
  for (const raw of lines) {
    const line=raw.trim();
    if (line==='BEGIN:VEVENT'){cur={};continue;}
    if (line==='END:VEVENT'){if(cur)out.push(cur);cur=null;continue;}
    if (!cur) continue;
    const c=line.indexOf(':'); if(c===-1)continue;
    const k=line.slice(0,c).split(';')[0].toUpperCase();
    const v=line.slice(c+1).replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/g,'\n').replace(/\\/g,'').trim();
    if(k==='SUMMARY')cur.summary=v; if(k==='DTSTART')cur.dtstart=line.slice(c+1).trim();
    if(k==='DTEND')cur.dtend=line.slice(c+1).trim(); if(k==='LOCATION')cur.location=v;
    if(k==='DESCRIPTION')cur.description=v;
    if(k==='STATUS')cur.status=v; if(k==='UID')cur.uid=v;
  }
  return out;
}

function parseDT(s) {
  const r=(s.includes(':')?s.split(':').pop():s).replace(/Z$/,'');
  if(r.length===8)return{y:+r.slice(0,4),m:+r.slice(4,6)-1,d:+r.slice(6,8),time:null,allDay:true};
  return{y:+r.slice(0,4),m:+r.slice(4,6)-1,d:+r.slice(6,8),time:r.slice(9,11)+':'+r.slice(11,13),allDay:false};
}

function fmt12(t){
  if(!t)return'';
  const[h,mn]=t.split(':').map(Number);
  return`${h%12||12}:${String(mn).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}

// "09:00" + "20:30" → "9:00 AM – 8:30 PM" (end optional)
function timeRange(start,end){
  if(!start)return'';
  return fmt12(start)+(end?` – ${fmt12(end)}`:'');
}

// "3:30 PM – 5:00 PM" → 930 (minutes past midnight). All-day / untimed → -1, so they sort first.
function startMinutes(ev){
  const m=/(\d{1,2}):(\d{2})\s*([AP])M/i.exec(ev.time||'');
  if(!m)return -1;
  const h=(+m[1]%12)+(/p/i.test(m[3])?12:0);
  return h*60+ +m[2];
}

// Chronological order within one day. Untimed events lead; among those the multi-day
// bars come last and keep a stable uid order so they line up across cells.
function byStartTime(a,b){
  const am=startMinutes(a),bm=startMinutes(b);
  if(am!==bm)return am-bm;
  const rank=e=>(e.uid&&e.uid.startsWith('multi-'))?1:0;
  if(rank(a)!==rank(b))return rank(a)-rank(b);
  if(rank(a)===1)return String(a.uid).localeCompare(String(b.uid));
  return (a.title||'').localeCompare(b.title||'');
}

function soccerIcon(s){
  if(/game|scrimmage/i.test(s))return'⚽'; if(/practice/i.test(s))return'🏃';
  if(/training/i.test(s))return'🎯';       if(/clinic/i.test(s))return'⭐';
  if(/cup|tournament|fest/i.test(s))return'🏆'; if(/meeting|kick-off/i.test(s))return'📋';
  if(/photo/i.test(s))return'📸';           if(/ball chaser|dinner/i.test(s))return'🍔';
  if(/open play/i.test(s))return'🎮';       return'⚽';
}

function schoolIcon(s){
  if(/no school|break|holiday/i.test(s))return'🚫';
  if(/first .*day|last .*day/i.test(s))return'🎒';
  if(/conference/i.test(s))return'🗣️';       if(/early release|late start/i.test(s))return'⏰';
  if(/graduation/i.test(s))return'🎓';       return'🏫';
}

// In Playmetrics: practice DESCRIPTION is the venue (e.g. "National Sports Center Field 26"),
// game DESCRIPTION is opponent info, and LOCATION is always the street address.
// So we learn venue↔address pairings from practice-style events, then apply them to games.
function addressKey(loc){
  return (loc||'').split(',')[0].trim().toLowerCase();
}
function isVenueDescription(desc){
  if(!desc)return false;
  if(desc.includes('\n'))return false;       // games/clinics span multiple lines
  if(desc.length>80)return false;
  if(/<|&amp|&#|http/i.test(desc))return false;
  if(/\bat\b/i.test(desc)&&/\d/.test(desc))return false; // "Team A at Team B"
  return true;
}
function extractJersey(desc){
  if(!desc)return'';
  const m=desc.match(/^\s*(?:Uniform|Attire):\s*(.+)$/im);
  return m?m[1].trim():'';
}
function cleanVenueName(name){
  return name.replace(/\s+Field\s+\d+.*$/i,'').replace(/\s+\d+v\d+.*$/i,'').trim()||name;
}
function buildVenueMap(allEvents){
  const map=new Map();
  for(const ev of allEvents){
    if(!isVenueDescription(ev.description))continue;
    const k=addressKey(ev.location);
    if(!k||map.has(k))continue;
    map.set(k,cleanVenueName(ev.description));
  }
  return map;
}
function fieldNameForEvent(ev,venueMap){
  if(isVenueDescription(ev.description))return ev.description.trim();
  const k=addressKey(ev.location);
  if(k&&venueMap.has(k))return venueMap.get(k);
  return ev.location?ev.location.split(',')[0].trim():'';
}

// An all-day VEVENT's DTEND is exclusive (RFC 5545 §3.6.1), so spring break
// published as DTSTART 3/8 + DTEND 3/13 covers Mar 8–12 — five days, one VEVENT.
function allDaySpan(start,end){
  const a=new Date(start.y,start.m,start.d), b=new Date(end.y,end.m,end.d);
  const n=Math.round((b-a)/86400000);
  return Math.min(Math.max(n,1),60); // clamp so a malformed feed can't flood the calendar
}

function ingestFeed(vevents, feed, venueMap) {
  let count=0;
  for(const ev of vevents){
    if(!ev.summary||!ev.dtstart||ev.status==='CANCELLED')continue;
    const dt=parseDT(ev.dtstart);
    const endDt=ev.dtend?parseDT(ev.dtend):null;
    const ts=dt.allDay?'All Day':timeRange(dt.time,endDt?endDt.time:'');
    const pickIcon=feed.icon||soccerIcon;
    const base={title:feed.clean(ev.summary),person:feed.person,
      time:ts,icon:pickIcon(ev.summary),
      location:feed.noVenue?(ev.location||'').trim():fieldNameForEvent(ev,venueMap),
      jersey:feed.noVenue?'':extractJersey(ev.description),uid:ev.uid||'',fromICS:true};
    const days=dt.allDay&&endDt&&endDt.allDay?allDaySpan(dt,endDt):1;
    // Spread a multi-day span across every day it covers, sharing one "multi-"
    // uid so the grid draws it as a connected band (same as manual trips).
    const groupUid=days>1?'multi-ics-'+(ev.uid||`${dt.y}${dt.m}${dt.d}-${base.title}`):base.uid;
    const cur=new Date(dt.y,dt.m,dt.d);
    for(let i=0;i<days;i++){
      const key=`${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;
      if(!events[key])events[key]=[];
      events[key].push({...base,uid:groupUid});
      count++;
      cur.setDate(cur.getDate()+1);
    }
  }
  return count;
}

// SYNC
// ═══════════════════════════════════════════════
async function syncICS() {
  const btn=document.getElementById('syncBtn'), bar=document.getElementById('syncBar'), msg=document.getElementById('syncMsg');
  btn.classList.add('syncing'); btn.textContent='⟳ Syncing…';
  bar.classList.remove('hidden'); msg.textContent='Fetching calendar feeds…';
  try {
    await clearICSFromDB();
    let total=0;
    const perFeed=[];
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const fetchFeed=async(url)=>{
      const errors=[];
      // The public proxies return intermittent 5xx, so make two full passes
      // before declaring a feed dead — one bad round shouldn't drop a schedule.
      for (let attempt=0; attempt<2; attempt++) {
        for (let i=0; i<PROXIES.length; i++) {
          const buildUrl=PROXIES[i];
          const proxyName=['allorigins','corsproxy.io','codetabs'][i]||`proxy${i}`;
          try {
            const res=await fetch(buildUrl(url));
            if(res.ok){
              const text=await res.text();
              if(text.includes('BEGIN:VEVENT')){
                return text;
              }
              errors.push(`${proxyName}: no VEVENTs in response`);
              continue;
            }
            errors.push(`${proxyName}: HTTP ${res.status}`);
          } catch(e) {
            errors.push(`${proxyName}: ${e.message}`);
          }
        }
        if(attempt===0)await sleep(800);
      }
      throw new Error(`all proxies failed (${errors.join('; ')})`);
    };
    // Phase 1: fetch + parse all feeds
    const parsed=[];
    for(const feed of ICS_FEEDS){
      const name=feed.label||feed.person;
      msg.textContent=`Fetching ${name}…`;
      try {
        const text=await fetchFeed(feed.url);
        parsed.push({feed, vevents:parseICS(text)});
      } catch(feedErr) {
        perFeed.push(`${name}: FAILED`);
        console.warn(`❌ ${name} feed failed:`, feedErr.message);
      }
    }
    // Phase 2: build address→venue map from all parsed events
    const venueMap=buildVenueMap(parsed.flatMap(p=>p.vevents));
    // Phase 3: ingest using the shared venue map
    for(const {feed, vevents} of parsed){
      const name=feed.label||feed.person;
      try {
        const count=ingestFeed(vevents, feed, venueMap);
        perFeed.push(`${name}: ${count}`);
        total+=count;
        console.log(`✅ ${name} feed: ${count} events`);
      } catch(feedErr) {
        perFeed.push(`${name}: FAILED`);
        console.warn(`❌ ${name} feed failed:`, feedErr.message);
      }
    }
    const rows=[];
    for(const[key,evList]of Object.entries(events))
      for(const ev of evList)
        if(ev.fromICS)rows.push({calendar_id:CALENDAR_ID,event_key:key,title:ev.title,
          person:ev.person,time:ev.time||'',icon:ev.icon||'',location:ev.location||'',
          jersey:ev.jersey||'',uid:ev.uid||'',from_ics:true});
    let schoolCloudFail=false;
    if(rows.length){
      let payload=rows;
      let {error}=await db.from('events').insert(payload);
      if(error&&/jersey/i.test(error.message||'')){
        // jersey column doesn't exist yet — retry without it so events still persist
        console.warn('jersey column missing in events table — run: ALTER TABLE events ADD COLUMN jersey text;');
        payload=payload.map(({jersey,...r})=>r);
        ({error}=await db.from('events').insert(payload));
      }
      if(error&&/person|constraint|check/i.test(error.message||'')&&payload.some(r=>r.person==='school')){
        // An older CHECK constraint on events.person may not allow 'school'.
        // Save everything else rather than failing the whole sync; school events
        // still render this session from the local cache.
        console.warn("events.person rejected 'school' — school events not saved to cloud. "
          +'Fix: drop/extend the person check constraint on the events table. Details:', error.message);
        schoolCloudFail=true;
        payload=payload.filter(r=>r.person!=='school');
        error=payload.length?(await db.from('events').insert(payload)).error:null;
      }
      if(error)throw error;
    }
    lsSet('fam-events-v6',events);
    renderCalendar(); renderReminders();
    msg.textContent=`✅ Synced ${total} events (${perFeed.join(', ')})`
      +(schoolCloudFail?' — ⚠️ school events local only, see console':'');
    setTimeout(()=>bar.classList.add('hidden'),6000);
  } catch(e){
    msg.textContent='⚠️ Sync failed — check connection.'; console.error(e);
    setTimeout(()=>bar.classList.add('hidden'),5000);
  }
  btn.classList.remove('syncing'); btn.textContent='⚽🏫 Sync Feeds';
}
document.getElementById('syncBtn').addEventListener('click',syncICS);

// ═══════════════════════════════════════════════
// MIGRATE LOCAL-ONLY DATA → SUPABASE
// Run pushLocalToSupabase() from the browser console after fixing the
// calendar_id schema, to push events / meal library / day-meal records
// that were previously saved only to localStorage.
// ═══════════════════════════════════════════════
// Remove duplicate items from meal_library and side_library by name (case-insensitive).
// Keeps the entry with the highest times_used; deletes the rest from Supabase.
async function dedupeLibraries(){
  console.log('🔍 Scanning libraries for duplicates…');
  let mealRemoved=0, sideRemoved=0;
  const dedupe = async (lib, table) => {
    const groups = new Map();
    for (const item of lib) {
      const k = (item.name||'').trim().toLowerCase();
      if (!k) continue;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(item);
    }
    let removed = 0;
    for (const items of groups.values()) {
      if (items.length < 2) continue;
      items.sort((a,b)=>(b.timesUsed||0)-(a.timesUsed||0));
      for (let i=1; i<items.length; i++) {
        const drop = items[i];
        try {
          if (isDbId(drop.id)) await db.from(table).delete().eq('id', drop.id);
          removed++;
        } catch(e) { console.warn(`Failed to delete duplicate "${drop.name}":`, e.message); }
      }
    }
    return removed;
  };
  mealRemoved = await dedupe(mealLib, 'meal_library');
  sideRemoved = await dedupe(sideLib, 'side_library');
  await Promise.all([loadMealLib(), loadSideLib()]);
  renderCalendar();
  console.log(`✅ Removed ${mealRemoved} duplicate meal(s), ${sideRemoved} duplicate side(s).`);
  return {mealRemoved, sideRemoved};
}

function isDbId(id){
  if (id == null) return false;
  if (typeof id === 'number') return true;
  const s = String(id);
  if (s.startsWith('local-')) return false;
  if (/^d\d+$/.test(s) || /^sd\d+$/.test(s)) return false; // default seed ids
  // Numeric string OR UUID format (Supabase default for new tables)
  return /^\d+$/.test(s) || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
}

async function pushLocalToSupabase(){
  console.log('📤 Pushing local-only data to Supabase…');

  // 1) Push meal library items (covers default seeds 'd1'-'d15' AND user adds with 'local-' ids)
  const libIdMap={}; // old library id → new DB id
  let libPushed=0,libFailed=0;
  for(const item of mealLib){
    if(isDbId(item.id))continue;
    try{
      const{data,error}=await db.from('meal_library').insert({
        calendar_id:CALENDAR_ID,name:item.name,icon:item.icon||'🍽️',
        times_used:item.timesUsed||0,last_used:item.lastUsed
      }).select().single();
      if(error)throw error;
      libIdMap[item.id]=data.id;
      item.id=data.id;
      libPushed++;
    }catch(e){console.warn(`mealLib "${item.name}" failed:`,e.message);libFailed++;}
  }

  // 2) Push day-meal records (translate old library ids to new)
  let mealsPushed=0,mealsFailed=0;
  for(const[key,m]of Object.entries(meals)){
    if(isDbId(m.id))continue;
    if(!m.name)continue; // skip sides-only records (no DB representation yet)
    const dbMealId=libIdMap[m.mealId]||(isDbId(m.mealId)?m.mealId:null);
    try{
      const{data,error}=await db.from('meals').insert({
        calendar_id:CALENDAR_ID,event_key:key,
        meal_lib_id:dbMealId,name:m.name,icon:m.icon,sides:m.sides||[]
      }).select().single();
      if(error)throw error;
      m.id=data.id;
      if(dbMealId)m.mealId=dbMealId;
      mealsPushed++;
    }catch(e){console.warn(`meal "${m.name}" on ${key} failed:`,e.message);mealsFailed++;}
  }

  // 2.5) Push side library items
  const sideIdMap = {};
  let sideLibPushed=0, sideLibFailed=0;
  for (const item of sideLib) {
    if (isDbId(item.id)) continue;
    try {
      const { data, error } = await db.from('side_library').insert({
        calendar_id:CALENDAR_ID, name:item.name, icon:item.icon||'🥣',
        times_used:item.timesUsed||0, last_used:item.lastUsed
      }).select().single();
      if (error) throw error;
      sideIdMap[item.id] = data.id;
      item.id = data.id;
      sideLibPushed++;
    } catch(e) { console.warn(`sideLib "${item.name}" failed:`, e.message); sideLibFailed++; }
  }
  // 2.6) Re-save sides on meal records (translate old side ids, push to DB)
  let sideOnMealsPushed = 0;
  for (const [k, m] of Object.entries(meals)) {
    if (!m.sides || !m.sides.length) continue;
    let mutated = false;
    for (const s of m.sides) {
      if (sideIdMap[s.id]) { s.id = sideIdMap[s.id]; mutated = true; }
    }
    if (isDbId(m.id)) {
      try {
        await db.from('meals').update({ sides: m.sides }).eq('id', m.id);
        sideOnMealsPushed++;
      } catch(e) { console.warn(`sides on ${k} failed:`, e.message); }
    } else if (mutated) {
      // No DB id yet — will be pushed in step 2 below (ensure sides included there too)
    }
  }

  // 3) Push events (the main thing the user is worried about)
  let evPushed=0,evFailed=0;
  for(const[key,list]of Object.entries(events)){
    for(const ev of list){
      if(isDbId(ev.id))continue;
      try{
        const{data,error}=await db.from('events').insert({
          calendar_id:CALENDAR_ID,event_key:key,title:ev.title,person:ev.person,
          persons:ev.persons||(ev.person?[ev.person]:[]),
          time:ev.time||'',icon:ev.icon||'',location:ev.location||'',
          uid:ev.uid||'',from_ics:ev.fromICS||false
        }).select().single();
        if(error)throw error;
        ev.id=data.id;
        evPushed++;
      }catch(e){console.warn(`event "${ev.title}" on ${key} failed:`,e.message);evFailed++;}
    }
  }

  lsSet('fam-events-v6',events);
  lsSet('fam-meals-v6',meals);
  lsSet('fam-meallib-v6',mealLib);
  lsSet('fam-sidelib-v1',sideLib);

  console.log(`✅ Pushed: ${evPushed} event(s), ${libPushed} meal lib, ${mealsPushed} day meal(s), ${sideLibPushed} side lib, ${sideOnMealsPushed} sides-on-meals updated.`);
  if(evFailed||libFailed||mealsFailed||sideLibFailed){
    console.warn(`⚠️  Failures: ${evFailed} events, ${libFailed} mealLib, ${mealsFailed} meals, ${sideLibFailed} sideLib. See warnings above.`);
  }
  console.log('Hard-refresh to confirm everything loads from Supabase.');
  return{evPushed,libPushed,mealsPushed,sideLibPushed,sideOnMealsPushed,evFailed,libFailed,mealsFailed,sideLibFailed};
}

async function addEv(y,m,d,ev,doSave=true){
  const key=`${y}-${m}-${d}`;
  if(!events[key])events[key]=[];
  if(!ev.fromICS&&events[key].some(e=>e.title===ev.title&&!e.fromICS&&e.uid===(ev.uid||'')))return;
  events[key].push(ev);
  if(doSave)await saveEvent(key,ev);
}

function isoDate(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

function getMultiDayGroup(uid){
  if(!uid||!uid.startsWith('multi-'))return[];
  const result=[];
  for(const[k,evList]of Object.entries(events)){
    for(const ev of evList){
      if(ev.uid===uid)result.push({key:k,ev});
    }
  }
  result.sort((a,b)=>{
    const[ay,am,ad]=a.key.split('-').map(Number);
    const[by,bm,bd]=b.key.split('-').map(Number);
    return new Date(ay,am,ad)-new Date(by,bm,bd);
  });
  return result;
}

async function cleanupSeedData(){
  if(lsGet('fam-seed-cleanup-v3'))return;
  events={};
  localStorage.removeItem('fam-events-v6');
  lsSet('fam-seed-cleanup-v3',true);
  console.log('🧹 Cleared local event cache. Soccer will resync next.');
}

function initPersonPills(containerId){
  document.querySelectorAll(`#${containerId} .person-pill`).forEach(el=>{
    el.addEventListener('click',()=>{
      const person=el.dataset.person;
      const wasActive=el.classList.contains('active');
      const allPills=document.querySelectorAll(`#${containerId} .person-pill`);
      if(person==='family'){
        allPills.forEach(b=>b.classList.remove('active'));
        if(!wasActive)el.classList.add('active');
      }else{
        const familyEl=document.querySelector(`#${containerId} .person-pill.family`);
        if(familyEl)familyEl.classList.remove('active');
        el.classList.toggle('active');
      }
    });
  });
}
function getSelectedPersons(containerId){
  return [...document.querySelectorAll(`#${containerId} .person-pill.active`)].map(el=>el.dataset.person);
}
function setSelectedPersons(containerId,persons){
  const set=new Set(persons||[]);
  document.querySelectorAll(`#${containerId} .person-pill`).forEach(el=>{
    el.classList.toggle('active',set.has(el.dataset.person));
  });
}
function applyPersonStyle(el,ev){
  const persons=ev.persons||(ev.person?[ev.person]:[]);
  if(persons.length>1){
    const stops=persons.map((p,i)=>{
      const a=(i/persons.length)*100;
      const b=((i+1)/persons.length)*100;
      return `var(--${p}-lt) ${a}%, var(--${p}-lt) ${b}%`;
    }).join(', ');
    el.style.background=`linear-gradient(135deg, ${stops})`;
    el.style.color='var(--text)';
  }
}

// CALENDAR RENDER

const MONTHS=['January','February','March','April','May','June',
              'July','August','September','October','November','December'];

function buildDayCell(year,month,day,isCur,opts={}){
  const detail=!!opts.detail;
  const isToday=day===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
  const key=`${year}-${month}-${day}`;
  const dayEvs=(events[key]||[]).filter(eventVisible);
  const cell=document.createElement('div');
  cell.className='cal-cell'+(isCur?'':' other-month')+(isToday?' today':'');
  const numEl=document.createElement('div');
  numEl.className='day-num';numEl.textContent=day;
  cell.appendChild(numEl);
  const isMulti=e=>e.uid&&e.uid.startsWith('multi-');
  const sorted=dayEvs.slice().sort(byStartTime);
  const MAX=detail?Infinity:3;
  sorted.slice(0,MAX).forEach(ev=>{
    const chip=document.createElement('div');
    let cls=`event-chip ${ev.person}`;
    let tipExtra='';
    if(isMulti(ev)){
      const group=getMultiDayGroup(ev.uid);
      if(group.length>1){
        const idx=group.findIndex(g=>g.key===key);
        if(idx===0)cls+=' multi-day-start';
        else if(idx===group.length-1)cls+=' multi-day-cont multi-day-end';
        else cls+=' multi-day-cont';
        tipExtra=` · Day ${idx+1} of ${group.length}`;
      }
    }
    chip.className=cls;
    applyPersonStyle(chip,ev);
    chip.title=ev.title+(ev.time?' · '+ev.time:'')+tipExtra;
    if(detail){
      const titleEl=document.createElement('div');
      titleEl.className='ec-title';
      titleEl.textContent=(ev.icon?ev.icon+' ':'')+ev.title;
      chip.appendChild(titleEl);
      if(ev.time){
        const t=document.createElement('div');
        t.className='ec-meta';t.textContent=ev.time;
        chip.appendChild(t);
      }
      if(ev.location){
        const l=document.createElement('div');
        l.className='ec-meta';l.textContent='📍 '+ev.location;
        chip.appendChild(l);
      }
      if(ev.jersey){
        const j=document.createElement('div');
        j.className='ec-meta';j.textContent='👕 '+ev.jersey;
        chip.appendChild(j);
      }
    }else{
      chip.textContent=(ev.icon?ev.icon+' ':'')+ev.title;
    }
    cell.appendChild(chip);
  });
  if(sorted.length>MAX){
    const more=document.createElement('div');
    more.className='more-chip';
    more.textContent=`+${sorted.length-MAX} more`;
    cell.appendChild(more);
  }
  cell.addEventListener('click',()=>openPanel(year,month,day,'events'));
  return cell;
}

function buildMealCell(year,month,day,isCur){
  const key=`${year}-${month}-${day}`;
  const meal=meals[key];
  const cell=document.createElement('div');
  cell.className='meal-strip-cell'+(isCur?'':' other-month-meal');
  const hasMain=meal&&meal.name;
  const hasSides=meal&&meal.sides&&meal.sides.length;
  if(hasMain||hasSides){
    const sidesStr=hasSides?meal.sides.map(s=>s.icon||'🥣').join(''):'';
    const mainPart=hasMain
      ?`<span class="meal-icon">${meal.icon||'🍽️'}</span><span class="meal-name">${meal.name}${sidesStr?' · '+sidesStr:''}</span>`
      :`<span class="meal-icon">🥣</span><span class="meal-name">${sidesStr}</span>`;
    cell.innerHTML=`${mainPart}
      <button class="meal-del" title="Remove meal" onclick="event.stopPropagation();removeMealFromStrip('${key}')">✕</button>`;
  }else{
    cell.innerHTML=`<span class="meal-empty">+ dinner</span>`;
  }
  cell.addEventListener('click',()=>openPanel(year,month,day,'meal'));
  return cell;
}

function buildWeekRow(grid,weekStart,refMonth,refYear,opts={}){
  for(let dow=0;dow<7;dow++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+dow);
    const isCur=refMonth==null||(d.getMonth()===refMonth&&d.getFullYear()===refYear);
    grid.appendChild(buildDayCell(d.getFullYear(),d.getMonth(),d.getDate(),isCur,opts));
  }
  const strip=document.createElement('div');
  strip.className='meal-strip';
  for(let dow=0;dow<7;dow++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+dow);
    const isCur=refMonth==null||(d.getMonth()===refMonth&&d.getFullYear()===refYear);
    strip.appendChild(buildMealCell(d.getFullYear(),d.getMonth(),d.getDate(),isCur));
  }
  grid.appendChild(strip);
}

function fillMonthGrid(grid,year,month){
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const total=Math.ceil((firstDay+daysInMonth)/7)*7;
  const startDate=new Date(year,month,1-firstDay);
  for(let week=0;week<total/7;week++){
    const ws=new Date(startDate);ws.setDate(startDate.getDate()+week*7);
    buildWeekRow(grid,ws,month,year);
  }
}

function updateTitle(){

    const anchor=new Date(viewYear,viewMonth,viewDay);

    const sat=new Date(sun);sat.setDate(sun.getDate()+6);
    const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    el.textContent=`${fmt(sun)} – ${fmt(sat)}, ${sat.getFullYear()}`;
  }else if(viewMode==='quarter'){
    let endM=viewMonth+2,endY=viewYear;
    if(endM>11){endM-=12;endY++;}
    const sameYear=endY===viewYear;
    el.textContent=sameYear
      ?`${MONTHS[viewMonth].slice(0,3)} – ${MONTHS[endM].slice(0,3)} ${viewYear}`
      :`${MONTHS[viewMonth].slice(0,3)} ${viewYear} – ${MONTHS[endM].slice(0,3)} ${endY}`;

    el.textContent=`${MONTHS[viewMonth]} ${viewYear}`;

// UPCOMING MILESTONES STRIP
// ═══════════════════════════════════════════════
// A milestone is a personal (non-ICS) event that's either all-day (birthdays,
// anniversaries) or part of a multi-day group (trips, vacations).
function isMilestone(ev){
  if(ev.fromICS)return false;
  if(ev.time==='All Day')return true;
  if(ev.uid&&ev.uid.startsWith('multi-'))return true;
  return false;
}

function collectUpcomingMilestones(limit){
  const now=new Date();now.setHours(0,0,0,0);
  const items=[];
  for(const[key,evs]of Object.entries(events)){
    const parts=key.split('-').map(Number);
    if(parts.length!==3||parts.some(n=>!Number.isFinite(n)))continue;
    const[y,m,d]=parts;
    const target=new Date(y,m,d);target.setHours(0,0,0,0);
    const days=Math.round((target-now)/(1000*60*60*24));
    if(days<0)continue;
    for(const ev of evs){
      if(!isMilestone(ev))continue;
      if(!eventVisible(ev))continue;
      items.push({y,m,d,days,ev});
    }
  }
  items.sort((a,b)=>a.days-b.days);
  // Dedupe multi-day groups — earliest non-past day wins (kept first after sort).
  const seenUids=new Set();
  const deduped=[];
  for(const it of items){
    const uid=it.ev.uid;
    if(uid&&uid.startsWith('multi-')){
      if(seenUids.has(uid))continue;
      seenUids.add(uid);
    }
    deduped.push(it);
  }
  return deduped.slice(0,limit);
}

function upcomingCountText(days){
  if(days===0)return'TODAY';
  if(days===1)return'tomorrow';
  if(days<=30)return`in ${days}d`;
  const weeks=Math.round(days/7);
  return`in ${weeks}w`;
}

function renderUpcomingStrip(){
  const strip=document.getElementById('upcomingStrip');
  if(!strip)return;
  const items=collectUpcomingMilestones(3);
  strip.innerHTML='';
  for(const{y,m,d,days,ev}of items){
    const el=document.createElement('button');
    el.type='button';
    const persons=ev.persons||(ev.person?[ev.person]:[]);
    const personCls=persons.length===1?' '+persons[0]:(persons.length===0?' family':'');
    el.className='upcoming-item'+personCls+(days===0?' today':'');
    el.innerHTML=`<span class="uc-icon">${ev.icon||'📌'}</span>`
      +`<span class="uc-title"></span>`
      +`<span class="uc-count"></span>`;
    el.querySelector('.uc-title').textContent=ev.title;
    el.querySelector('.uc-count').textContent=upcomingCountText(days);
    applyPersonStyle(el,ev); // gradient for multi-person events
    el.addEventListener('click',()=>openPanel(y,m,d,'events'));
    strip.appendChild(el);
  }
}

function renderCalendar(){
  updateTitle();
  renderUpcomingStrip();
  document.querySelectorAll('.view-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===viewMode));
  const topLabels=document.getElementById('topDayLabels');
  const container=document.getElementById('calGrid');
  container.innerHTML='';
  if(viewMode==='quarter'){
    topLabels.style.display='none';
    container.className='cal-multi';
    for(let i=0;i<3;i++){
      let m=viewMonth+i,y=viewYear;
      if(m>11){m-=12;y++;}
      const section=document.createElement('div');
      section.className='month-section';
      const title=document.createElement('div');
      title.className='month-section-title';
      title.textContent=`${MONTHS[m]} ${y}`;
      section.appendChild(title);
      section.appendChild(makeDayLabels());
      const grid=document.createElement('div');
      grid.className='cal-grid';
      fillMonthGrid(grid,y,m);
      section.appendChild(grid);
      container.appendChild(section);
    }
  }else if(viewMode==='week'){
    topLabels.style.display='';
    container.className='cal-grid week-view';
    const anchor=new Date(viewYear,viewMonth,viewDay);
    const sun=new Date(anchor);sun.setDate(anchor.getDate()-anchor.getDay());
    buildWeekRow(container,sun,null,null,{detail:true});
  }else{
    topLabels.style.display='';
    container.className='cal-grid';
    fillMonthGrid(container,viewYear,viewMonth);
  }
}

function daysAwayInfo(y,m,d){
  const now=new Date();now.setHours(0,0,0,0);
  const target=new Date(y,m,d);target.setHours(0,0,0,0);
  const days=Math.round((target-now)/(1000*60*60*24));
  if(days===0)return{text:'🎉 That\'s TODAY!',cls:'today'};
  if(days===1)return{text:'⏰ Tomorrow!',cls:'soon'};
  if(days===-1)return{text:'🕰 Yesterday',cls:'past'};
  if(days>1&&days<=7)return{text:`✨ Just ${days} days away!`,cls:'soon'};
  if(days>7&&days<=30)return{text:`📅 ${days} days away`,cls:''};
  if(days>30){
    const weeks=Math.round(days/7);
    return{text:`📅 ${days} days (${weeks} weeks) away`,cls:''};
  }
  return{text:`🕰 ${Math.abs(days)} days ago`,cls:'past'};
}

function openPanel(y,m,d,tab='events'){
  const panel=document.getElementById('sidePanel');
  panel.dataset.y=y;panel.dataset.m=m;panel.dataset.d=d;
  document.getElementById('panelDate').textContent=
    new Date(y,m,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const da=daysAwayInfo(y,m,d);
  const daEl=document.getElementById('daysAway');
  daEl.textContent=da.text;
  daEl.className='days-away'+(da.cls?' '+da.cls:'');
  switchPanelTab(tab);
  panel.classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function switchPanelTab(tab){
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.panel-tab-content').forEach(t=>t.classList.toggle('active',t.id===`tab-${tab}`));
  const panel=document.getElementById('sidePanel');
  const y=+panel.dataset.y,m=+panel.dataset.m,d=+panel.dataset.d;
  if(tab==='events'){
    renderPanelBody(y,m,d);
    document.getElementById('endDate').value=isoDate(y,m,d);
    document.getElementById('multiDayChk').checked=false;
    document.getElementById('multiDayFields').style.display='none';
    document.getElementById('newTimeRow').style.display='';
  }
  if(tab==='meal')renderMealPicker(y,m,d);
}

document.querySelectorAll('.panel-tab').forEach(btn=>{
  btn.addEventListener('click',()=>switchPanelTab(btn.dataset.tab));
});

function renderPanelBody(y,m,d){
  const body=document.getElementById('panelBody');
  const key=`${y}-${m}-${d}`;
  const evs=(events[key]||[]).filter(eventVisible).sort(byStartTime);
  body.innerHTML='';
  if(!evs.length){body.innerHTML='<div class="empty-day">No events — enjoy the free day! 🌤️</div>';return;}
  // One chronological list, earliest first. All-day items lead; headings appear only
  // when the day has both kinds, so a single-kind day stays a clean flat list.
  const add=list=>list.forEach(ev=>body.appendChild(mkEvent(ev,key)));
  const allDay=evs.filter(e=>startMinutes(e)<0), timed=evs.filter(e=>startMinutes(e)>=0);
  if(allDay.length&&timed.length){
    addSection(body,'📌 All Day');   add(allDay);
    addSection(body,'🕐 Scheduled'); add(timed);
  }else{
    add(evs);
  }
}

function addSection(parent,label){
  const t=document.createElement('div');t.className='panel-section-title';t.textContent=label;parent.appendChild(t);
}

function mkEvent(ev,key){
  const el=document.createElement('div');el.className=`panel-event ${ev.person}`;
  applyPersonStyle(el,ev);
  const loc=ev.location?`<div class="ev-loc">📍 ${ev.location}</div>`:'';
  const kit=ev.jersey?`<div class="ev-loc">👕 ${ev.jersey}</div>`:'';
  let multiInfo='';
  if(ev.uid&&ev.uid.startsWith('multi-')){
    const group=getMultiDayGroup(ev.uid);
    if(group.length>1){
      const idx=group.findIndex(g=>g.key===key);
      const fmt=(s)=>{const[y,m,d]=s.split('-').map(Number);
        return new Date(y,m,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});};
      multiInfo=`<div class="ev-multi-info">📅 ${fmt(group[0].key)} – ${fmt(group[group.length-1].key)} · Day ${idx+1} of ${group.length}</div>`;
    }
  }
  let actions='';
  if(ev.id&&!ev.fromICS){
    actions=`<span class="ev-actions">`
      +`<button class="ev-edit" title="Edit" onclick="openEditEvent('${key}','${ev.id}')">✏️</button>`
      +`<button class="ev-del" title="Delete" onclick="deleteAndRefresh('${key}','${ev.id}','${ev.uid||''}')">✕</button>`
      +`</span>`;
  }
  el.innerHTML=`<div class="icon">${ev.icon||'📌'}</div>
    <div class="info"><div class="ev-title">${ev.title}${actions}</div>
    <div class="ev-sub">${ev.time||''}</div>${multiInfo}${loc}${kit}</div>`;
  return el;
}

async function deleteAndRefresh(key,id,uid){
  const panel=document.getElementById('sidePanel');
  const y=+panel.dataset.y,m=+panel.dataset.m,d=+panel.dataset.d;
  if(uid&&uid.startsWith('multi-')){
    const group=getMultiDayGroup(uid);
    if(group.length>1){
      if(!confirm(`Delete all ${group.length} days of "${group[0].ev.title}"?`)){return;}
      for(const g of group){if(g.ev.id)await deleteEvent(g.key,g.ev.id);}
      renderCalendar();renderPanelBody(y,m,d);
      return;
    }
  }
  await deleteEvent(key,id);
  renderCalendar();renderPanelBody(y,m,d);
}

function guessEmoji(name,fallback){
  if(!name)return fallback;
  const lower=name.toLowerCase();
  for(const {match,emoji} of ICON_KEYWORDS){
    if(match.some(k=>lower.includes(k)))return emoji;
  }
  return fallback;
}

function renderMealPicker(y,m,d){
  const dateStr=new Date(y,m,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  const assigned=meals[key];

    has?`🍽️ ${dateStr}`:`🍽️ Pick dinner — ${dateStr}`;

  const hasMain=m&&m.name;

  if(!hasMain&&!hasSides){
    el.classList.add('empty');

function renderMealPickerList(query){
  const list=document.getElementById('mealPickerList');
  list.innerHTML='';
  const key=panelKey();
  const currentMainId=meals[key]&&meals[key].mealId;
  const filtered=query
    ?mealLib.filter(m=>m.name.toLowerCase().includes(query.toLowerCase()))
    :[...mealLib].sort((a,b)=>(b.timesUsed||0)-(a.timesUsed||0));
  if(!filtered.length){
    list.innerHTML='<div style="color:var(--muted);font-size:.84rem;padding:8px 0;">No meals found. Add one below!</div>';
    return;
  }
  filtered.forEach(item=>{
    const el=document.createElement('div');
    const isActive=item.id===currentMainId;
    el.className='meal-list-item'+(isActive?' active':'');
    const lastUsed=item.lastUsed?`Last: ${item.lastUsed}`:'Never made';
    el.innerHTML=`
      <span class="ml-icon">${item.icon}</span>
      <div class="ml-info">
        <div class="ml-name">${item.name}</div>
        <div class="ml-meta">${lastUsed}</div>
      </div>
      <span class="ml-times">${item.timesUsed||0}x</span>
      ${isActive?'<span class="ml-check">✓</span>':''}`;
    el.addEventListener('click',async()=>{
      const p=document.getElementById('sidePanel');
      await assignMeal(panelKey(),item);
      renderCalendar();
      renderMealPicker(+p.dataset.y,+p.dataset.m,+p.dataset.d);
    });
    list.appendChild(el);
  });
}

function renderSidePickerList(){
  const list=document.getElementById('sidePickerList');
  list.innerHTML='';
  const key=panelKey();
  const currentSideIds=new Set(((meals[key]&&meals[key].sides)||[]).map(s=>s.id));
  const sorted=[...sideLib].sort((a,b)=>(b.timesUsed||0)-(a.timesUsed||0));
  if(!sorted.length){
    list.innerHTML='<div style="color:var(--muted);font-size:.84rem;padding:8px 0;">No sides yet. Add one below!</div>';
    return;
  }
  sorted.forEach(item=>{
    const isActive=currentSideIds.has(item.id);
    const el=document.createElement('div');
    el.className='meal-list-item'+(isActive?' active':'');
    const lastUsed=item.lastUsed?`Last: ${item.lastUsed}`:'Never used';

      <span class="ml-icon">${item.icon}</span>
      <div class="ml-info">
        <div class="ml-name">${item.name}</div>
        <div class="ml-meta">${lastUsed}</div>

let currentLibType='meal'; // 'meal' | 'side'

    ?{items:sideLib,noun:'side',titlePlural:'Sides',titleIcon:'🥣',
      emojis:SIDE_EMOJIS,getEmoji:()=>libSideEmoji,
      setEmoji:em=>{libSideEmoji=em;},del:deleteSideFromLib,verb:'used'}
    :{items:mealLib,noun:'meal',titlePlural:'Meals',titleIcon:'🍽️',
      emojis:MEAL_EMOJIS,getEmoji:()=>libMealEmoji,
      setEmoji:em=>{libMealEmoji=em;},del:deleteMealFromLib,verb:'cooked'};
}

// Live icon guessing — library modal add field
document.getElementById('libMealName').addEventListener('input',e=>{
  if(!libEmojiAuto)return;
  const fallback=currentLibType==='side'?'🥣':'🍽️';
  const guessed=guessEmoji(e.target.value,fallback);
  if(currentLibType==='side')libSideEmoji=guessed;
  else libMealEmoji=guessed;
  document.getElementById('libEmoji').textContent=guessed;
});

function renderMealModal(){
  const s=getLibState();
  document.getElementById('mealModalTitle').textContent=`${s.titleIcon} ${s.titlePlural} Library`;
  document.getElementById('libEmoji').textContent=s.getEmoji();
  document.getElementById('libMealName').placeholder=`Add new ${s.noun} to library…`;
  document.querySelectorAll('[data-mtab]').forEach(b=>{
    const m=b.dataset.mtab;
    if(m==='top')b.textContent=`⭐ Top ${s.titlePlural}`;
    else if(m==='all')b.textContent=`📋 All ${s.titlePlural}`;
    else if(m==='recent')b.textContent='🕐 Recent';
  });

  const cont=document.getElementById('mealModalContent');
  cont.innerHTML='';
  let sorted=[...s.items];
  if(currentMTab==='top')sorted.sort((a,b)=>(b.timesUsed||0)-(a.timesUsed||0));
  else if(currentMTab==='recent')sorted=sorted.filter(m=>m.lastUsed).sort((a,b)=>b.lastUsed?.localeCompare(a.lastUsed||''));
  else sorted.sort((a,b)=>a.name.localeCompare(b.name));

  if(!sorted.length){
    cont.innerHTML=`<div style="color:var(--muted);padding:16px 0;text-align:center;">No ${s.noun}s yet — add some below!</div>`;
    return;
  }

  sorted.forEach((item,idx)=>{
    const el=document.createElement('div');
    el.className='top-meal-item';
    const rank=currentMTab==='top'?`${idx+1}.`:'•';
    const lastUsed=item.lastUsed?`Last ${s.verb}: ${item.lastUsed}`:`Never ${s.verb} yet`;
    el.innerHTML=`
      <div class="tm-rank">${rank}</div>
      <div class="tm-icon">${item.icon}</div>
      <div class="tm-info">
        <div class="tm-name">${item.name}</div>
        <div class="tm-sub">${lastUsed}</div>
      </div>
      <div class="tm-badge">${item.timesUsed||0}x</div>
      <button class="tm-del" data-id="${item.id}" data-libtype="${currentLibType}-del">🗑️</button>`;
    el.querySelector('.tm-del').addEventListener('click',(e)=>{
      e.stopPropagation();
      deleteLibItemAndRefresh(item.id);
    });
    cont.appendChild(el);
  });
}

async function deleteLibItemAndRefresh(id){
  const s=getLibState();
  if(!confirm(`Remove this ${s.noun} from your library?`))return;
  await s.del(id);
  renderMealModal();
  if(currentLibType==='side')renderSidePickerList();
  else renderMealPickerList(document.getElementById('mealSearch').value||'');
}

// EDIT EVENT MODAL
// ═══════════════════════════════════════════════
let editingState=null; // {key, id, uid, group:[{key,ev}]}

// which=0 → start time, which=1 → end time of a "6:00 PM – 8:30 PM" range
function parse12to24(s,which=0){
  if(!s||s==='All Day')return '';
  const part=(s.split('–')[which]||'').trim();
  const m=part.match(/^(\d+):(\d{2})\s*(AM|PM)?/i);
  if(!m)return '';
  let h=+m[1];const min=m[2];const ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h<12)h+=12;
  if(ap==='AM'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+min;
}

function openEditEvent(key,id){
  const idStr=String(id);
  const ev=(events[key]||[]).find(e=>String(e.id)===idStr);
  if(!ev)return;
  const isMulti=ev.uid&&ev.uid.startsWith('multi-');
  const group=isMulti?getMultiDayGroup(ev.uid):[{key,ev}];
  editingState={key,id:idStr,uid:ev.uid||'',group};

  document.getElementById('editTitle').value=ev.title;
  setSelectedPersons('editPersonPills',ev.persons||(ev.person?[ev.person]:[]));
  document.getElementById('editMultiChk').checked=isMulti&&group.length>1;

  const startKey=group[0].key;
  const endKey=group[group.length-1].key;
  const[sy,sm,sd]=startKey.split('-').map(Number);
  const[ey,em,ed]=endKey.split('-').map(Number);
  document.getElementById('editDate').value=isoDate(sy,sm,sd);
  document.getElementById('editStartDate').value=isoDate(sy,sm,sd);
  document.getElementById('editEndDate').value=isoDate(ey,em,ed);
  document.getElementById('editTime').value=parse12to24(ev.time)||'09:00';
  document.getElementById('editEndTime').value=parse12to24(ev.time,1);
  const isAllDay=ev.time==='All Day'&&!(isMulti&&group.length>1);
  document.getElementById('editAllDayChk').checked=isAllDay;
  document.getElementById('editTimeRow').style.display=isAllDay?'none':'';
  document.getElementById('editTimeLabel').style.display=isAllDay?'none':'';

  toggleEditFields(isMulti&&group.length>1);
  document.getElementById('editEventModal').classList.add('open');
}

function toggleEditFields(isMulti){
  document.getElementById('editSingleFields').style.display=isMulti?'none':'';
  document.getElementById('editMultiFields').style.display=isMulti?'':'none';
}

document.getElementById('editMultiChk').addEventListener('change',e=>{
  toggleEditFields(e.target.checked);
});

});

});

document.getElementById('editSaveBtn').addEventListener('click',async()=>{
  if(!editingState)return;
  // Capture and immediately clear so a second tap can't run this handler twice
  const state=editingState;
  editingState=null;

  const restore=()=>{editingState=state;};
  const title=document.getElementById('editTitle').value.trim();
  const persons=getSelectedPersons('editPersonPills');
  const isMulti=document.getElementById('editMultiChk').checked;
  if(!title){document.getElementById('editTitle').focus();restore();return;}
  if(!persons.length){alert('Pick at least one person.');restore();return;}
  const icon=persons.map(p=>PERSON_ICONS[p]||'📌').join('');
  const person=persons[0];

  // Validate dates BEFORE deleting anything, so a failed validation doesn't orphan events
  let plan;
  if(isMulti){
    const startStr=document.getElementById('editStartDate').value;
    const endStr=document.getElementById('editEndDate').value;
    if(!startStr||!endStr){alert('Set both start and end dates.');restore();return;}
    const[sy,sm,sd]=startStr.split('-').map(Number);
    const[ey,em,ed]=endStr.split('-').map(Number);
    const start=new Date(sy,sm-1,sd);
    const end=new Date(ey,em-1,ed);
    if(end<start){alert('End must be on or after start.');restore();return;}
    plan={kind:'multi',start,end};
  }else{
    const dateStr=document.getElementById('editDate').value;
    if(!dateStr){alert('Pick a date.');restore();return;}
    const[y,m,d]=dateStr.split('-').map(Number);
    plan={kind:'single',y,m:m-1,d};
  }

  // Validation passed — now wipe and recreate
  for(const g of state.group){if(g.ev.id)await deleteEvent(g.key,g.ev.id);}

  if(plan.kind==='multi'){
    const groupUid='multi-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
    const cur=new Date(plan.start);
    while(cur<=plan.end){
      await addEv(cur.getFullYear(),cur.getMonth(),cur.getDate(),
        {title,time:'All Day',person,persons,icon,uid:groupUid});
      cur.setDate(cur.getDate()+1);
    }
  }else{
    const allDay=document.getElementById('editAllDayChk').checked;
    const time=document.getElementById('editTime').value;
    const endTime=document.getElementById('editEndTime').value;
    const t=allDay?'All Day':timeRange(time,endTime);
    await addEv(plan.y,plan.m,plan.d,{title,time:t,person,persons,icon});
  }

  document.getElementById('editEventModal').classList.remove('open');
  renderCalendar();renderReminders();
  const p=document.getElementById('sidePanel');
  if(p.classList.contains('open'))renderPanelBody(+p.dataset.y,+p.dataset.m,+p.dataset.d);
});

document.getElementById('editDeleteBtn').addEventListener('click',async()=>{
  if(!editingState)return;
  const multi=editingState.group.length>1;
  const msg=multi
    ?`Delete all ${editingState.group.length} days of "${editingState.group[0].ev.title}"?`
    :'Delete this event?';
  if(!confirm(msg))return;
  for(const g of editingState.group){if(g.ev.id)await deleteEvent(g.key,g.ev.id);}
  document.getElementById('editEventModal').classList.remove('open');
  editingState=null;
  renderCalendar();renderReminders();
  const p=document.getElementById('sidePanel');
  if(p.classList.contains('open'))renderPanelBody(+p.dataset.y,+p.dataset.m,+p.dataset.d);
});

// Cloud refresh — manual button + auto on visibility return
let lastRefresh = Date.now();
async function refreshAll(){
  const btn = document.getElementById('refreshBtn');
  if (btn.classList.contains('spinning')) return;
  btn.classList.add('spinning');
  try {
    await Promise.all([loadEvents(), loadMeals(), loadMealLib(), loadSideLib()]);
    renderCalendar();
    renderReminders();
    const p = document.getElementById('sidePanel');
    if (p.classList.contains('open')) renderPanelBody(+p.dataset.y, +p.dataset.m, +p.dataset.d);
    lastRefresh = Date.now();
  } catch(e) { console.warn('Refresh failed:', e.message); }
  btn.classList.remove('spinning');
}
document.getElementById('refreshBtn').addEventListener('click', refreshAll);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 30000) {
    refreshAll();
  }
});

function stepView(direction){
  if(viewMode==='week'){
    const d=new Date(viewYear,viewMonth,viewDay+direction*7);
    viewYear=d.getFullYear();viewMonth=d.getMonth();viewDay=d.getDate();
  }else if(viewMode==='quarter'){
    viewMonth+=direction*3;viewDay=1;
    while(viewMonth<0){viewMonth+=12;viewYear--;}
    while(viewMonth>11){viewMonth-=12;viewYear++;}
  }else{
    viewMonth+=direction;viewDay=1;
    if(viewMonth<0){viewMonth=11;viewYear--;}
    if(viewMonth>11){viewMonth=0;viewYear++;}
  }
  renderCalendar();
}

document.getElementById('prevBtn').addEventListener('click',()=>stepView(-1));
document.getElementById('nextBtn').addEventListener('click',()=>stepView(1));
document.getElementById('todayBtn').addEventListener('click',()=>{
  viewYear=today.getFullYear();viewMonth=today.getMonth();viewDay=today.getDate();
  renderCalendar();
});

document.querySelectorAll('.view-mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    viewMode=btn.dataset.mode;
    localStorage.setItem('fam-view-mode',viewMode);
    if(viewMode==='week'){
      if(viewYear!==today.getFullYear()||viewMonth!==today.getMonth())viewDay=1;
      else viewDay=today.getDate();
    }
    renderCalendar();
  });
});
